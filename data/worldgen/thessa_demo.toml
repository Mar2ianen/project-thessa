# Thessa demo world recipe: sim-first game planet, not noise.
# Tectonics + landmarks + erosion; GPT images only style hints.

[planet]
name = "thessa"
kind = "rocky"
datum_radius_m = 3_200_000.0
height_min_m = -8000.0
height_max_m = 12000.0
seed = 20260909

[gores]
count = 8
overlap_fraction = 0.06
polar_caps = true

[terrain]
mountain_coverage = 0.45
crater_density = 0.5
tectonic_activity = 0.6
volcanism = 0.55
erosion = 0.45
canyon_strength = 0.6
roughness = 0.5

[climate]
polar_extent = 0.18
aridity = 0.45
glaciation = 0.35

[readability]
macro_feature_strength = 1.0
biome_min_scale_km = 150.0
landmark_density = 0.7

[erosion]
thermal_iters = 10
talus_deg = 34.0
droplets = 4000
droplet_steps = 64

# --- plate boundaries: arcs, rift, trench ---
[[tectonics]]
id = "kestrel-arc"
kind = "subduction"
points = [[-30.0, -60.0], [-5.0, -45.0], [20.0, -30.0]]
width_m = 150_000.0
rate_m = 6000.0
arc_side = 1.0

[[tectonics]]
id = "meridian-rift"
kind = "rift"
points = [[-20.0, 60.0], [10.0, 70.0], [35.0, 85.0]]
width_m = 180_000.0
rate_m = 2500.0

[[tectonics]]
id = "pelagic-ridge"
kind = "ridge"
points = [[-50.0, 150.0], [-10.0, 165.0], [30.0, 175.0]]
width_m = 220_000.0
rate_m = 2200.0

# --- memorable landmarks ---
[[features]]
id = "godshammer-basin"
seed = 11
lat_deg = -25.0
lon_deg = 120.0
rotation_rad = 0.0
type = "impact_basin"
radius_m = 600_000.0
depth_m = 5000.0
rings = 3

[[features]]
id = "ashen-shield"
seed = 12
lat_deg = 8.0
lon_deg = -38.0
rotation_rad = 0.0
type = "shield_volcano"
radius_m = 280_000.0
height_m = 8000.0
caldera = true

[[features]]
id = "serpent-canyon"
seed = 13
lat_deg = 15.0
lon_deg = 45.0
rotation_rad = 0.6
type = "canyon"
length_m = 900_000.0
width_m = 60_000.0
depth_m = 3500.0
tributaries = 4

[[features]]
id = "white-eye-crater"
seed = 14
lat_deg = -45.0
lon_deg = -100.0
rotation_rad = 0.0
type = "crater"
rim_radius_m = 120_000.0
depth_m = 4000.0
central_peak = true
ejecta = true

[[features]]
id = "kestrel-range"
seed = 15
lat_deg = 5.0
lon_deg = -40.0
rotation_rad = 0.9
type = "mountain_range"
length_m = 1_100_000.0
width_m = 180_000.0
height_m = 6500.0
branches = 5

[[layers]]
name = "height"
file = "height_gore_{i}.png"
prompt = "prompts/height.md"

[[layers]]
name = "albedo"
file = "albedo_gore_{i}.png"
prompt = "prompts/albedo.md"

[[layers]]
name = "biomes"
file = "biomes_gore_{i}.png"
prompt = "prompts/biomes.md"

[[layers]]
name = "roughness"
file = "roughness_gore_{i}.png"
prompt = "prompts/roughness.md"

[[layers]]
name = "normal"
file = "normal_gore_{i}.png"
prompt = "prompts/normal.md"

[[layers]]
name = "hydrology"
file = "hydrology_gore_{i}.png"
prompt = "prompts/hydrology.md"

[[layers]]
name = "minerals"
file = "minerals_gore_{i}.png"
prompt = "prompts/minerals.md"

# --- authored landmark zones (layered over procedural features) ---
[[landmark_zones]]
id = "kestrel-launch-region"
center_lat_deg = -24.0
center_lon_deg = 118.0
radius_m = 40_000.0
blend_width_m = 15_000.0
mode = "surface_overlay"
surface_tags = ["launch_complex", "graded_plain"]

[[landmark_zones]]
id = "godshammer-detail"
center_lat_deg = -25.0
center_lon_deg = 120.0
radius_m = 150_000.0
blend_width_m = 60_000.0
mode = "procedural_override"
amplitude_m = 600.0
