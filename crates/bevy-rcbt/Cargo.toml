[package]
name = "thessa-bevy-rcbt"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT"
publish = false
description = "Universal Bevy scheduling adapter for the backend-neutral RCBT runtime"

[features]
default = []
render = ["bevy/bevy_render", "dep:bevy_core_pipeline"]
mesh-shaders = ["render", "dep:wgpu"]

[dependencies]
# Workspace Bevy (full features incl. render/Solari): the `render` feature
# only gates the render-world bridge, not the dependency itself. This keeps
# one Bevy build across the workspace instead of a second default-off copy.
bevy.workspace = true
bevy_core_pipeline = { version = "0.19.1", default-features = false, optional = true }
thessa-microstore-core = { path = "../microstore-core" }
thessa-graphics = { path = "../graphics" }
thessa-rcbt-core = { path = "../rcbt-core" }
wgpu = { version = "29.0.4", optional = true }

[dev-dependencies]
naga = { version = "29.0.4", features = ["wgsl-in"] }
wgpu.workspace = true
pollster = "0.4"
thessa-rcbt-wgpu = { path = "../rcbt-wgpu" }

[[bench]]
name = "material_storage"
harness = false
required-features = ["render"]
