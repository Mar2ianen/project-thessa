[package]
name = "thessa-render-assets"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT"
publish = false
description = "Bounded embedded static GLB decoding into backend-neutral mesh sources"

[dependencies]
thessa-render-core = { path = "../render-core" }
glam.workspace = true
gltf = { version = "1.4.1", default-features = false, features = ["utils", "names", "KHR_materials_emissive_strength"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[dev-dependencies]
serde_json = "1"

[[bench]]
name = "decode"
harness = false
