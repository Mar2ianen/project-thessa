# Mora generator-facing recipe stub (World Atlas §6.2).
# Basic markup only: physical data resolves by body id from
# data/system.toml; this file keeps worldgen/art values.
# datum_radius_m MUST agree with system.toml (see `check` below).
#
# Verify with:
#   cargo run -p thessa-worldgen-rocky -- check \
#     --system data/system.toml --body mora \
#     --recipe data/worldgen/mora.toml

[planet]
id = "mora"
seed = 14
datum_radius_m = 1900000.0
# Working relief envelope for a desiccated evaporite world: vast salt
# flats and collapsed shorelines are flat; dissolution karst adds meso
# relief. Deep hypersaline basins sit below datum.
height_min_m = -6000.0
height_max_m = 4000.0

[terrain]
mountain_coverage = 0.08
crater_density = 0.15
volcanism = 0.10
erosion_strength = 0.50
glaciation = 0.05
rift_activity = 0.15
roughness_macro = 0.25
plateau_coverage = 0.10
