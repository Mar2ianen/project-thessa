# Mira generator-facing recipe stub (World Atlas §3.2).
# Basic markup only: physical data resolves by body id from
# data/system.toml; this file keeps worldgen/art values.
# datum_radius_m MUST agree with system.toml (see `check` below).
#
# Verify with:
#   cargo run -p thessa-worldgen-rocky -- check \
#     --system data/system.toml --body mira \
#     --recipe data/worldgen/mira.toml

[planet]
id = "mira"
seed = 13
datum_radius_m = 4100000.0
# Working relief envelope for a large icy-rocky double-planet
# companion: large impact basins, tidal fracture terrain, cold traps.
height_min_m = -8000.0
height_max_m = 10000.0

[terrain]
mountain_coverage = 0.15
crater_density = 0.50
volcanism = 0.15
erosion_strength = 0.25
glaciation = 0.30
rift_activity = 0.40
roughness_macro = 0.50
plateau_coverage = 0.10
