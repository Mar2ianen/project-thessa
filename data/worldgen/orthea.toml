# Orthea generator-facing recipe stub (World Atlas §3.1).
# Basic markup only: physical data resolves by body id from
# data/system.toml; this file keeps worldgen/art values.
# datum_radius_m MUST agree with system.toml (see `check` below).
#
# Verify with:
#   cargo run -p thessa-worldgen-rocky -- check \
#     --system data/system.toml --body orthea \
#     --recipe data/worldgen/orthea.toml

[planet]
id = "orthea"
seed = 12
datum_radius_m = 8200000.0
# Working relief envelope for a cold high-pressure terrestrial:
# glacial valleys, buried ice provinces, continental highlands.
height_min_m = -12000.0
height_max_m = 15000.0

[terrain]
mountain_coverage = 0.20
crater_density = 0.30
volcanism = 0.10
erosion_strength = 0.40
glaciation = 0.55
rift_activity = 0.15
roughness_macro = 0.45
plateau_coverage = 0.15
