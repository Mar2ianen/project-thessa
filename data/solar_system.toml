# Solar System design data for maneuver-planner validation (v0.1).
# Real masses, sizes, and orbit shapes (semi-major axis, eccentricity,
# inclination); phases are APPROXIMATE J2000 mean anomalies (mean
# longitude minus longitude of perihelion, nodes/apsides aligned to the
# reference direction). Good enough to validate transfer ENERGIES against
# flown missions (Hohmann classes, C3, arrival v_inf); window DATES are
# design-relative, not launch commit dates. Units mirror system.toml.
# Sources: JPL/NASA fact sheets (rounded to the precision the planner can
# resolve — mass to ~0.1%, angles to ~0.01 deg).

[meta]
epoch_name = "J2000_APPROX"
status = "validation-target-not-canonical"
runtime_body_motion = "baked_ephemerides"
vehicle_gravity = "multi_body_test_particle"

