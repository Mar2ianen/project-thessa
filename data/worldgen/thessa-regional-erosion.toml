# Physical local refinement of the existing global erosion artifact.
# The 128 km domains include an outer context apron around each survey site.
# Open edges retain parent height and report exported sediment explicitly.
[[region]]
id = "dry-highland-plateau"
center_lat_deg = 38.0
center_lon_deg = -171.0
spacing_m = 256.0
cells = 512
[region.runoff]
iterations = 128
years_per_iteration = 10000.0
erodibility = 0.00002
sediment_transport_m = 2000.0

