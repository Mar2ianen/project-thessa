# Mission replay fixtures: docs/07 section 7.14, fidelity L0-L2.
#
# Data-driven qualification for the maneuver planner on the real Solar
# System (data/solar_system.toml, APPROXIMATE J2000 phases). Windows are
# design-relative (days past EPOCH), never historical dates; the anchors
# are mission ARCHITECTURE (encounter order, leg time-of-flight class)
# and transfer ENERGY (departure, arrival v_inf, totals). Exact N-body
# revalidation and live-authority agreement are L3-L4 (slower jobs); these
# fixtures are broad-survey only and must stay millisecond-class for CI.
#
# Rule: a fixture pins what flown missions teach (sequence, TOF class,
# energy class), never planner internals. Caps carry ~10% headroom over
# measured deterministic winners so genuine regressions trip while grid
# noise does not.

[[direct]]
name = "apollo-earth-luna"
central = "earth"
departure = "earth"
arrival = "luna"
departure_span_d = 30.0
departure_steps = 120
tof_min_d = 3.0
tof_max_d = 7.0
tof_steps = 40
keep = 4
max_broad_dv_mps = 15000.0
# Apollo: TLI 3033 + LOI 954 = 3987. The planner prices the LEO vector
# change plus lunar v_inf (rendezvous-null vs capture differs by ~vcirc,
# asserted at exact level elsewhere, not here).
max_winner_total_dv_mps = 4400.0
max_winner_departure_dv_mps = 3550.0
max_winner_arrival_vinf_mps = 900.0
winner_tof_min_d = 3.0
winner_tof_max_d = 7.0

