# Solar System design data for maneuver-planner validation (v0.2).
# Real masses, sizes, and full Kepler orientations (semi-major axis,
# eccentricity, inclination, longitude of ascending node, argument of
# periapsis); phases are APPROXIMATE J2000 mean anomalies M = L - ϖ.
# Orientation source: JPL Keplerian Elements Table 1 (mean ecliptic and
# equinox of J2000, valid 1800-2050; Standish). a/e/i match that table to
# file precision; node/perihelion are exact J2000 (v0.1 aligned them all
# to the reference direction, which priced Mercury-class windows ~2.5x
# hot and hid free-assist geometry). Good enough to validate transfer
# ENERGIES against flown missions (Hohmann classes, C3, arrival v_inf);
# window DATES are design-relative, not launch commit dates. Units mirror
# system.toml. Moon elements are Meeus Ch.47 J2000 means (node regresses
# 19.3 deg/yr in reality; pinned here like all other J2000 osculations).

[meta]
epoch_name = "J2000_APPROX"
status = "validation-target-not-canonical"
runtime_body_motion = "baked_ephemerides"
vehicle_gravity = "multi_body_test_particle"

