# Example procedural-body vehicle: Juno-style round stack (boat-tail,
# barrel tank with real propellant, ogive nose) plus hand mass/inertia.
# The baker compiles bodies hangar-side into strip panels, hull mass,
# feed-pipeline tanks, and contact parts; flight sees only the baked
# vehicle definition.
name = "example-body-rocket"
mass_kg = 500.0
# Symmetric positive-definite inertia tensor, written as rows.
inertia_body_kg_m2 = [
  [800.0, 0.0, 0.0],
  [0.0, 1500.0, 0.0],
  [0.0, 0.0, 1500.0],
]

[[procedural_bodies]]
name = "core"
origin_body_m = [0.0, 0.0, 0.0]

[[procedural_bodies.stations]]
x_m = 0.0
half_width_m = 0.55
top_height_m = 0.55
bottom_height_m = 0.55
top_exponent = 2.0
bottom_exponent = 2.0
offset_y_m = 0.0
offset_z_m = 0.0

