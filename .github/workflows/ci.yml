name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  root-workspace:
    name: Root workspace
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --workspace

      - name: Run release simulation tests
        run: cargo test -p thessa-sim-core --release

      - name: Compile gravity benchmark
        run: cargo bench -p thessa-sim-core --bench gravity --no-run

  reference-validation:
    name: Nyx reference validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run isolated numerical harness
        run: cargo run --manifest-path validation/nyx-compare/Cargo.toml --release
