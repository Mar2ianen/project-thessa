[package]
name = "thessa-terrain-native"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "GPL-3.0-or-later"
publish = false
description = "Bevy-free canonical terrain migration viewer and frame benchmark"

[features]
default = ["hud"]
hud = ["dep:egui", "dep:egui-wgpu", "dep:egui-winit"]

[dependencies]
thessa-audio-core = { path = "../../crates/audio-core" }
thessa-audio-synth = { path = "../../crates/audio-synth" }
rodio = { version = "0.22.2", default-features = false, features = ["playback"] }
thessa-render-assets = { path = "../../crates/render-assets" }
thessa-render-core = { path = "../../crates/render-core" }
thessa-render-wgpu = { path = "../../crates/render-wgpu" }
thessa-terrain-stream = { path = "../../crates/terrain-stream" }
thessa-rcbt-core = { path = "../../crates/rcbt-core" }
thessa-worldgen-rocky = { path = "../../tools/worldgen-rocky" }
thessa-flight-authority = { path = "../../crates/flight-authority" }
thessa-flight-net = { path = "../../crates/flight-net" }
thessa-collision = { path = "../../crates/collision" }
thessa-sim-core = { path = "../../crates/sim-core" }
thessa-atmosphere = { path = "../../crates/atmosphere" }
thessa-graphics = { path = "../../crates/graphics" }
thessa-perf = { path = "../../crates/perf" }
thessa-plume-core = { path = "../../crates/plume-core" }
glam.workspace = true
rayon.workspace = true
toml.workspace = true
wgpu.workspace = true
png = "0.18"
winit = "0.30.13"
egui = { version = "0.37", default-features = false, optional = true }
egui-wgpu = { version = "0.37", default-features = false, optional = true }
egui-winit = { version = "0.37", default-features = false, features = ["clipboard", "wayland", "x11"], optional = true }

[dev-dependencies]
naga = { version = "30.0.1", features = ["wgsl-in"] }
