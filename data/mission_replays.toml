[[chain]]
name = "voyager1-earth-jupiter-saturn"
central = "sol"
departure = "earth"
# Discovered unprompted by the planner: ~20 yr span covers the full
# Jupiter-Saturn synodic beat (19.86 yr), so an alignment season exists
# somewhere by construction. Winner found at T+220d: 511 d Earth->Jupiter
# leg (V1 flew 546 d), C3 ~111 (V1: 105), near-free Jupiter bend.
# Slow-drift Saturn flavor (1833 d leg, V1 sprinted 620 d): the grid
# minimizes total dv, not time. Cool multi-leg EXACT needs joint
# multiple shooting (L4); this fixture pins broad discovery (L0-L2).
encounters = [
  { body = "jupiter", kind = "flyby", standoff_m = 210000000.0 },
  { body = "saturn", kind = "flyby", standoff_m = 124000000.0 },
]
departure_span_d = 7300.0
departure_steps = 300
leg_tof_min_d = [400.0, 300.0]
leg_tof_max_d = [900.0, 2600.0]
leg_tof_steps = [10, 10]
keep = 4
max_broad_dv_mps = 40000.0
max_winner_total_dv_mps = 9000.0
max_winner_departure_dv_mps = 8200.0
max_winner_turn_dv_mps = 1500.0
winner_leg_tof_min_d = [400.0, 300.0]
winner_leg_tof_max_d = [900.0, 2600.0]

[[chain]]
name = "voyager2-grand-tour"
central = "sol"
departure = "earth"
# Voyager 2 class: launch Sep 1977 -> Jupiter Jul 1979 (~670 d) ->
# Saturn Aug 1981 (~780 d) -> Uranus Jan 1986 (~1610 d) -> Neptune
# Aug 1989 (~1310 d); CAs from planet centers: 722/161/107/29 Mm
# (standoffs below = CA minus body radius, i.e. periapsis classes).
# Grand-Tour-class alignments recur ~175 yr (1977 flown). Wide scans
# find NOTHING sub-40k in 2000-2080 and a 64k-monster family at C3 200k
# caps in 2000-2020 (documented negative controls); the next
# discoverable season in this ephemeris sits ~2155-2165, so the domain
# covers T+52000d..T+64000d with margin. The planner still discovers
# epochs, TOFs and bends inside — no dates are fed.
# Slow-drift flavor (dv-optimum, like the V1 fixture): legs run longer
# than flown (sprint costs dv). Cool multi-leg EXACT needs joint
# arrival-velocity control (L4); this fixture pins broad discovery.
encounters = [
  { body = "jupiter", kind = "flyby", standoff_m = 650000000.0 },
  { body = "saturn", kind = "flyby", standoff_m = 103000000.0 },
  { body = "uranus", kind = "flyby", standoff_m = 82000000.0 },
  { body = "neptune", kind = "flyby", standoff_m = 5000000.0 },
]
window_start_d = 52000.0
departure_span_d = 12000.0
departure_steps = 150
leg_tof_min_d = [400.0, 300.0, 800.0, 600.0]
leg_tof_max_d = [1100.0, 2600.0, 3600.0, 2600.0]
leg_tof_steps = [5, 5, 5, 5]
keep = 4
max_broad_dv_mps = 40000.0
max_winner_total_dv_mps = 27000.0
max_winner_departure_dv_mps = 8400.0
max_winner_turn_dv_mps = 18000.0
winner_leg_tof_min_d = [400.0, 300.0, 800.0, 600.0]
winner_leg_tof_max_d = [1100.0, 2600.0, 3600.0, 2600.0]
