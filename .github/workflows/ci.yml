name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  cross-platform:
    name: ${{ matrix.os }} / stable
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libasound2-dev \
            libudev-dev \
            libwayland-dev \
            libx11-dev \
            libxkbcommon-dev \
            pkg-config

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check all targets and features
        run: cargo check --workspace --all-targets --all-features

      - name: Run workspace tests
        run: cargo test --workspace

  quality:
    name: Formatting and Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Linux native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libasound2-dev \
            libudev-dev \
            libwayland-dev \
            libx11-dev \
            libxkbcommon-dev \
            pkg-config

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  release-simulation:
    name: Release simulation checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Linux native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libasound2-dev \
            libudev-dev \
            libwayland-dev \
            libx11-dev \
            libxkbcommon-dev \
            pkg-config

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run release simulation tests
        run: cargo test -p thessa-sim-core --release

      - name: Run release SIMD kernel tests
        run: cargo test -p thessa-simd --release

      - name: Compile gravity benchmark
        run: cargo bench -p thessa-sim-core --bench gravity --no-run

      - name: Compile aero benchmark
        run: cargo bench -p thessa-sim-core --bench aero --no-run

      - name: Compile flight benchmark
        run: cargo bench -p thessa-sim-core --bench flight --no-run

      - name: Compile osculating benchmark
        run: cargo bench -p thessa-sim-core --bench osculating --no-run

      - name: Compile onrails benchmark
        run: cargo bench -p thessa-sim-core --bench onrails --no-run

      - name: Compile gravity interpolation benchmark
        run: cargo bench -p thessa-sim-core --bench gravity_interpolation --no-run

      - name: Compile terrain tile benchmark
        run: cargo bench -p thessa-worldgen-rocky --bench tiles --no-run

  reference-validation:
    name: Reference validation
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run Nyx isolated numerical harness
        run: cargo run --manifest-path validation/nyx-compare/Cargo.toml --release

      - name: Run deterministic aero comparison harness
        run: cargo run --manifest-path validation/aero-compare/Cargo.toml --release
