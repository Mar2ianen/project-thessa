[package]
name = "thessa-render-wgpu"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT"
publish = false
description = "Thessa-owned wgpu backend bring-up: headless device, capability probe, frame primitives"

[dependencies]
thessa-render-core = { path = "../render-core" }
thessa-graphics = { path = "../graphics" }
thessa-wgpu-exp = { path = "../wgpu-exp" }
thessa-rcbt-core = { path = "../rcbt-core" }
thessa-rcbt-wgpu = { path = "../rcbt-wgpu" }
glam.workspace = true
wgpu.workspace = true
pollster = "0.4"

[dev-dependencies]
naga = { version = "30", features = ["wgsl-in"] }
thessa-render-assets = { path = "../render-assets" }
png = "0.18"

[[bench]]
name = "clear"
harness = false

[[bench]]
name = "mesh"
harness = false
