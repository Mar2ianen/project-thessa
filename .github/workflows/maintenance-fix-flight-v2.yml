name: Maintenance flight coherence v2

on:
  push:
    branches: [bugfix-flight-coherence]
    paths:
      - .github/workflows/maintenance-fix-flight-v2.yml
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: bugfix-flight-coherence

      - name: Install Linux native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libasound2-dev \
            libudev-dev \
            libwayland-dev \
            libx11-dev \
            libxkbcommon-dev \
            pkg-config

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Apply reviewed fixes
        run: python3 .github/scripts/maintenance_fix_flight.py

      - name: Format Rust
        run: cargo fmt --all

      - name: Re-bake celestial descriptor
        run: |
          cargo run -p thessa-system-baker -- \
            --input data/system.toml \
            --output data/system.baked.json

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run sim-core tests
        run: cargo test -p thessa-sim-core

      - name: Run client tests
        run: cargo test -p thessa-client --bin thessa-client

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Check diff whitespace
        run: git diff --check

      - name: Commit verified fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/client/src/pilot.rs \
            apps/client/src/navigation.rs \
            crates/sim-core/src/aero.rs \
            crates/sim-core/src/atmosphere.rs \
            crates/sim-core/src/flight.rs \
            crates/sim-core/src/tests.rs \
            data/system.baked.json \
            docs/01_CELESTIAL_SYSTEM.md \
            CHANGELOG.md \
            .github/workflows/ci.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: make flight sampling and frames coherent"
          git push origin HEAD:bugfix-flight-coherence
